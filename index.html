<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Republic Mex City | Inicio</title>
    <style>
        /* Estilos integrados para la página de Republic Mex City */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
        }

        .header {
            background-color: #000000;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 10;
        }

        .logo {
            max-height: 120px;
            width: auto;
        }

        .portada {
            position: relative;
            height: 90vh;
            /* La imagen debe llamarse exactamente portada.jpg en tu repositorio */
            background-image: url('./portada.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .contenido-portada {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .contenido-portada h1 {
            color: #ffffff;
            font-size: 4.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 3px 3px 10px #000000;
        }

        .contenido-portada p {
            color: #d1d1d1;
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px #000000;
        }

        .btn-principal {
            display: inline-block;
            padding: 15px 30px;
            background-color: #ffcc00;
            color: #000000;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-principal:hover {
            background-color: #e6b800;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <!-- La imagen debe llamarse exactamente logo.png en tu repositorio -->
            <img src="./logo.png" alt="Logo de Republic Mex City" class="logo">
        </div>
    </header>

    <section class="portada">
        <div class="overlay"></div>
        <div class="contenido-portada">
            <h1>REPUBLIC MEX CITY</h1>
            <p>La experiencia definitiva de rol. Crea tu historia.</p>
            <a href="#unete" class="btn-principal">Únete a la ciudad</a>
        </div>
    </section>

</body>
</html>
